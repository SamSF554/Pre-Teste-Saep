<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estoque Almoxarifado</title>
  <link rel="stylesheet" href="css/estilo.css">
</head>

<body>
  <header class="cabecalho">
    <div class="logo">Estoque Almoxarifado</div>
    <nav class="menu">
      <a href="painel.html">Painel</a>
      <a href="material.html">Materiais</a>
      <a href="movimentacoes.html">Movimentações</a>
      <a href="index.html" id="link-sair">Sair</a>
    </nav>
  </header>
  <main>
    <h1>Materiais</h1>
    <section class="cartao">
      <h2>Cadastrar novo material</h2>
      <form id="form-Material">
        <label for="nome">Nome do produto</label>
        <input type="text" id="nome" placeholder="Ex.: Sabão em pó" required>
        <label for="autor">Autor</label>
        <input type="text" id="autor" placeholder="Ex.: Samuel Ferreira" required>
        <label for="quantidade_estoque">Quantidade em estoque</label>
        <input type="number" id="quantidade_estoque" min="0" value="0">
        <button type="submit" class="botao">Cadastrar</button>
      </form>
      <p id="mensagem" class="mensagem"></p>
    </section>
    <section class="cartao">
      <h2>Materiais cadastrados</h2>
      <div class="linha-busca">
        <input type="text" id="busca-nome" placeholder="Buscar pelo título...">
        <button type="button" id="botao-buscar" class="botao">Buscar</button>
      </div>
      <div class="tabela-rolagem">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Nome</th>
              <th>autor</th>
              <th>Estoque</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="lista-materiais">
          </tbody>
        </table>
      </div>
      <div class="paginacao">
        <button type="button" id="botao-anterior" class="botao botao-pequeno">Anterior</button>
        <span>Página <strong id="numero-pagina">1</strong></span>
        <button type="button" id="botao-proxima" class="botao botao-pequeno">Próxima</button>
      </div>
    </section>
  </main>
  <footer class="rodape">
    Estoque Almoxarifado © 2026 | Feito por Samuel
  </footer>
  <script src="js/comum.js"></script>
  <script src="js/livros.js"></script>
</body>

</html>
