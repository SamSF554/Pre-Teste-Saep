<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movimentações | Almoxarifado</title>
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <header class="cabecalho">
    <div class="logo">📦 Sistema Almoxarifado</div>
    <nav class="menu">
      <a href="painel.html">Painel</a>
      <a href="produtos.html">Produtos</a>
      <a href="movimentacoes.html">Movimentações</a>
      <a href="index.html" id="link-sair">Sair</a>
    </nav>
  </header>
  <main>
    <h1>Movimentações de Estoque</h1>
    <section class="cartao">
      <h2>Registrar entrada ou saída</h2>
      <form id="form-movimentacao">
        <label for="produto_id">Produto</label>
        <select id="produto_id" required>
          <option value="">Selecione um produto</option>
        </select>
        <label for="tipo">Tipo de Movimentação</label>
        <select id="tipo" required>
          <option value="entrada">Entrada</option>
          <option value="saida">Saída</option>
        </select>
        <label for="quantidade">Quantidade</label>
        <input type="number" id="quantidade" min="1" value="1" required>
        <button type="submit" class="botao">Registrar</button>
      </form>
      <p id="mensagem" class="mensagem"></p>
    </section>
    
    <section class="cartao">
      <h2>Histórico</h2>
      <div class="tabela-rolagem">
        <table>
          <thead>
            <tr>
              <th>Data</th>
              <th>Produto</th>
              <th>Tipo</th>
              <th>Quantidade</th>
            </tr>
          </thead>
          <tbody id="lista-movimentacoes"></tbody>
        </table>
      </div>
    </section>
  </main>
  <footer class="rodape">Sistema Almoxarifado © 2026</footer>
  <script src="js/comum.js"></script>
  <script src="js/movimentacoes.js"></script>
</body>
</html>
